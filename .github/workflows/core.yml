name: WRT-CORE

on:
  workflow_call:
    inputs:
      TARGET:
        required: true
        type: string
      REPO_SOURCE:
        required: true
        type: string
      REPO_URL:
        required: true
        type: string
      REPO_BRANCH:
        required: true
        type: string
      FEEDS_CONF:
        required: true
        type: string
      CONFIG_FILE:
        required: true
        type: string

# [修复1] 并发控制必须放在「调用方」ipq60xx-nowifiV2.yml 的 job 上，不能放这里。
#   官方文档明确警告：如果调用方和被调用方同时设置 concurrency 且
#   cancel-in-progress: true、group 值相同，会导致运行中的工作流把自己取消掉。
#   而且 called workflow 里 ${{ github.workflow }} 返回的是「调用方」的名字，
#   两边都写 ${{ github.workflow }} 会撞成同一个 group。
#   所以这里不设，统一由 caller 的 jobs.build.concurrency 控制。

# [修复2] write-all 过于宽泛，release 只需要 contents: write。
#   注意：权限只能被降低不能提升（官方文档：
#   "The GITHUB_TOKEN permissions passed from the caller workflow can be
#    only downgraded (not elevated) by the called workflow."），
#   所以调用方给 write-all 时，这里声明 contents: write 会生效。
permissions:
  contents: write

env:
  TARGET: ${{inputs.TARGET}}
  REPO_SOURCE: ${{inputs.REPO_SOURCE}}
  REPO_URL: ${{inputs.REPO_URL}}
  REPO_BRANCH: ${{inputs.REPO_BRANCH}}
  FEEDS_CONF: ${{inputs.FEEDS_CONF}}
  CONFIG_FILE: ${{inputs.CONFIG_FILE}}
  TZ: Asia/Shanghai
  # [修复3] Handles.sh 引用了 $WRT_MainPath 但全仓库从未定义过，
  #   导致 nss-firmware 修复、golang 覆盖两段逻辑全部静默失效。
  WRT_MainPath: /workdir/openwrt

jobs:
  build:
    runs-on: ubuntu-22.04

    # [修复4] GitHub 单 job 上限 6 小时。原来 `make -j || make -j1` 的兜底
    #   单线程重编必然超时，不如让它早点失败并留下完整日志。
    timeout-minutes: 350

    steps:

      # [修复5] 建议把第三方 action 按 commit SHA 固定（防上游被投毒/改坏）。
      #   这里仍保留浮动标签，请你用 `git ls-remote <repo> <ref>` 取到真实 SHA 后替换：
      #     git ls-remote https://github.com/jlumbroso/free-disk-space main
      #     git ls-remote https://github.com/stupidloud/cachewrtbuild main
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo timedatectl set-timezone "$TZ"
          git config --global user.email "aa@163.com"
          git config --global user.name "aa"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          cd openwrt
          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
          echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
          echo "WRT_MainPath=$PWD" >> $GITHUB_ENV

      - name: Cache
        uses: stupidloud/cachewrtbuild@main
        with:
          ccache: true
          mixkey: ${{env.REPO_SOURCE}}-${{env.REPO_BRANCH}}-${{env.WRT_HASH}}
          prefix: ${{ env.OPENWRT_PATH }}

      - name: Update Feeds
        run: |
          # [修复6] 仓库里根本没有 feeds.conf.default，这个 cp 恒为假，
          #   FEEDS_CONF 入参一直是死配置。要么删掉它，要么真的提供文件（推荐后者）。
          if [ -e "$GITHUB_WORKSPACE/$FEEDS_CONF" ]; then
            cp "$GITHUB_WORKSPACE/$FEEDS_CONF" openwrt/feeds.conf.default
          else
            echo "::warning::$FEEDS_CONF 不存在，使用源码自带 feeds.conf.default"
          fi
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Custom Packages
        env:
          # [修复7] Packages.sh 里调 GitHub API 取最新 release，
          #   匿名限流 60 次/小时，Runner 共享出口 IP 经常被打满 → 静默跳过版本更新。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./openwrt/package/
          $GITHUB_WORKSPACE/scripts/Packages.sh
          $GITHUB_WORKSPACE/scripts/Handles.sh

      - name: Custom Settings
        run: |
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          cd ./openwrt
          $GITHUB_WORKSPACE/scripts/Settings.sh

      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          # [修复8] 打印被 defconfig 丢弃的失效符号，避免 .config 悄悄腐化
          ./scripts/diffconfig.sh > /tmp/diff.config 2>/dev/null || true
          make download -j8 V=s
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          # [修复9] 原来 `make -j$(nproc) || make -j1 || make -j1 V=s`：
          #   第一次失败后单线程重编，6 小时必然超时，而且第一次没有 V=s 拿不到有效日志。
          #   改成：先并行全量并保留日志，失败后再单线程重跑失败目标。
          make -j$(nproc) V=s 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::首次编译失败，单线程重试以定位错误"
            make -j1 V=s IGNORE_ERRORS=1 || true
            tail -n 200 build.log
            exit 1
          fi
          echo "status=success" >> $GITHUB_OUTPUT
          echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success'  && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Release Firmware
        uses: softprops/action-gh-release@v2.1.0
        if: steps.compile.outputs.status == 'success'  && !cancelled()
        with:
          tag_name: ${{env.TARGET}}_${{env.FILE_DATE}}
          files: ${{ env.FIRMWARE }}/*
          body: |
            云编译zn_m2 nowifi openwrt-6.x最新固件。

            源码：${{env.REPO_URL}}
            分支：${{env.REPO_BRANCH}}
            平台：${{env.TARGET}}
